spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

app:
  analytics:
    enabled: ${ANALYTICS_ENABLED:false}
  commercial:
    quota-enforcement-enabled: ${COMMERCIAL_QUOTA_ENFORCEMENT:true}
  connector:
    master-key: ${DATASOURCE_MASTER_KEY}
    allow-private-network: ${DATASOURCE_ALLOW_PRIVATE_NETWORK:false}
    allowed-ports: ${DATASOURCE_ALLOWED_PORTS:3306,5432}
  datasource:
    enabled: true
    mysql:
      jdbc-url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=VERIFY_IDENTITY
      username: ${MYSQL_APP_USER}
      password: ${MYSQL_APP_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      pool-name: mysql-pool
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:8}
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:32}
      connection-timeout-ms: ${MYSQL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout-ms: 1000
      idle-timeout-ms: 600000
      max-lifetime-ms: 1800000
    clickhouse:
      jdbc-url: jdbc:clickhouse:https://${CLICKHOUSE_HOST}:${CLICKHOUSE_PORT:8443}/${CLICKHOUSE_DATABASE:ai_bi_dws}?ssl=true
      username: ${CLICKHOUSE_APP_USER}
      password: ${CLICKHOUSE_APP_PASSWORD}
      driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
      pool-name: clickhouse-read-pool
      read-only: true
      minimum-idle: ${CLICKHOUSE_POOL_MIN_IDLE:4}
      maximum-pool-size: ${CLICKHOUSE_POOL_MAX_SIZE:24}
      connection-timeout-ms: ${CLICKHOUSE_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout-ms: 2000
      idle-timeout-ms: 300000
      max-lifetime-ms: 900000
    clickhouse-writer:
      jdbc-url: jdbc:clickhouse:https://${CLICKHOUSE_HOST}:${CLICKHOUSE_PORT:8443}/${CLICKHOUSE_WRITER_DATABASE:ai_bi_raw}?ssl=true
      username: ${CLICKHOUSE_WRITER_USER}
      password: ${CLICKHOUSE_WRITER_PASSWORD}
      driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
      pool-name: clickhouse-writer-pool
      read-only: false
      minimum-idle: ${CLICKHOUSE_WRITER_POOL_MIN_IDLE:2}
      maximum-pool-size: ${CLICKHOUSE_WRITER_POOL_MAX_SIZE:8}
      connection-timeout-ms: ${CLICKHOUSE_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout-ms: 2000
      idle-timeout-ms: 300000
      max-lifetime-ms: 900000
